snowflake_metrics:
  # ===========================================================================
  # ORDER METRICS
  # ===========================================================================
  - name: total_orders
    description: Total number of orders placed
    tables:
      - {{ ref('orders') }}
    expr: COUNT(DISTINCT {{ ref('orders', 'order_id') }})
    synonyms:
      - order_count
      - number_of_orders

  - name: total_revenue
    description: Total revenue from all orders (including tax)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    synonyms:
      - gross_revenue
      - total_sales
      - revenue

  - name: total_subtotal
    description: Total revenue before tax from all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'subtotal') }})
    synonyms:
      - pretax_revenue
      - revenue_before_tax

  - name: total_tax_collected
    description: Total tax collected from all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'tax_paid') }})
    synonyms:
      - tax_revenue
      - taxes_collected

  - name: total_order_cost
    description: Total cost of goods sold (supplies) for all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_cost') }})
    synonyms:
      - cogs
      - cost_of_goods_sold
      - total_cost

  - name: total_gross_profit
    description: Total gross profit (revenue minus cost of goods sold)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'subtotal') }}) - SUM({{ ref('orders', 'order_cost') }})
    synonyms:
      - gross_margin
      - profit_before_tax

  - name: average_order_value
    description: Average order value (total including tax)
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'order_total') }})
    synonyms:
      - aov
      - avg_order_value
      - mean_order_value

  - name: average_order_subtotal
    description: Average order subtotal (before tax)
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'subtotal') }})
    synonyms:
      - avg_pretax_order
      - mean_subtotal

  - name: total_food_items_ordered
    description: Total number of food items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_food_items') }})
    synonyms:
      - food_item_count
      - total_food_orders

  - name: total_drink_items_ordered
    description: Total number of drink items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_drink_items') }})
    synonyms:
      - drink_item_count
      - total_drink_orders

  - name: total_items_ordered
    description: Total number of items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_order_items') }})
    synonyms:
      - item_count
      - total_items

  - name: food_order_percentage
    description: Percentage of orders that contain food items
    tables:
      - {{ ref('orders') }}
    expr: |
      COUNT(CASE WHEN {{ ref('orders', 'is_food_order') }} = TRUE THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - pct_food_orders
      - food_order_rate

  - name: drink_order_percentage
    description: Percentage of orders that contain drink items
    tables:
      - {{ ref('orders') }}
    expr: |
      COUNT(CASE WHEN {{ ref('orders', 'is_drink_order') }} = TRUE THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - pct_drink_orders
      - drink_order_rate

  - name: gross_profit_margin
    description: Gross profit margin percentage (gross profit / revenue)
    tables:
      - {{ ref('orders') }}
    expr: |
      (SUM({{ ref('orders', 'subtotal') }}) - SUM({{ ref('orders', 'order_cost') }})) * 100.0 /
      NULLIF(SUM({{ ref('orders', 'subtotal') }}), 0)
    synonyms:
      - profit_margin
      - margin_percentage

  # ===========================================================================
  # CUSTOMER METRICS
  # ===========================================================================
  - name: total_customers
    description: Total number of unique customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(DISTINCT {{ ref('customers', 'customer_id') }})
    synonyms:
      - customer_count
      - unique_customers
      - number_of_customers

  - name: total_customer_lifetime_spend
    description: Total lifetime spend across all customers
    tables:
      - {{ ref('customers') }}
    expr: SUM({{ ref('customers', 'lifetime_spend') }})
    synonyms:
      - total_ltv
      - aggregate_customer_value

  - name: average_customer_lifetime_spend
    description: Average lifetime spend per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'lifetime_spend') }})
    synonyms:
      - avg_ltv
      - average_customer_value
      - avg_clv

  - name: average_orders_per_customer
    description: Average number of orders per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'count_lifetime_orders') }})
    synonyms:
      - avg_order_frequency
      - orders_per_customer

  - name: new_customer_count
    description: Number of new customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'new' THEN 1 END)
    synonyms:
      - new_customers
      - first_time_customers

  - name: returning_customer_count
    description: Number of returning customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'returning' THEN 1 END)
    synonyms:
      - repeat_customers
      - loyal_customers

  - name: returning_customer_percentage
    description: Percentage of customers who are returning customers
    tables:
      - {{ ref('customers') }}
    expr: |
      COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'returning' THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - retention_rate
      - repeat_customer_rate

  - name: average_customer_lifetime_tax
    description: Average lifetime tax paid per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'lifetime_tax_paid') }})
    synonyms:
      - avg_tax_per_customer

  # ===========================================================================
  # ORDER ITEM METRICS
  # ===========================================================================
  - name: total_order_items
    description: Total number of individual order items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT({{ ref('order_items', 'order_item_id') }})
    synonyms:
      - items_sold
      - line_items_count

  - name: total_product_revenue
    description: Total revenue from product sales (sum of product prices)
    tables:
      - {{ ref('order_items') }}
    expr: SUM({{ ref('order_items', 'product_price') }})
    synonyms:
      - product_sales
      - item_revenue

  - name: total_supply_cost
    description: Total cost of supplies for all order items
    tables:
      - {{ ref('order_items') }}
    expr: SUM({{ ref('order_items', 'supply_cost') }})
    synonyms:
      - item_cost
      - supply_expenses

  - name: average_product_price
    description: Average price per product sold
    tables:
      - {{ ref('order_items') }}
    expr: AVG({{ ref('order_items', 'product_price') }})
    synonyms:
      - avg_item_price
      - mean_product_price

  - name: food_items_sold
    description: Total number of food items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT(CASE WHEN {{ ref('order_items', 'is_food_item') }} = TRUE THEN 1 END)
    synonyms:
      - food_sales_count
      - jaffles_sold

  - name: drink_items_sold
    description: Total number of drink items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT(CASE WHEN {{ ref('order_items', 'is_drink_item') }} = TRUE THEN 1 END)
    synonyms:
      - drink_sales_count
      - beverages_sold

  - name: food_revenue
    description: Total revenue from food items
    tables:
      - {{ ref('order_items') }}
    expr: SUM(CASE WHEN {{ ref('order_items', 'is_food_item') }} = TRUE THEN {{ ref('order_items', 'product_price') }} ELSE 0 END)
    synonyms:
      - jaffle_revenue
      - food_sales

  - name: drink_revenue
    description: Total revenue from drink items
    tables:
      - {{ ref('order_items') }}
    expr: SUM(CASE WHEN {{ ref('order_items', 'is_drink_item') }} = TRUE THEN {{ ref('order_items', 'product_price') }} ELSE 0 END)
    synonyms:
      - beverage_revenue
      - drink_sales

  # ===========================================================================
  # PRODUCT METRICS
  # ===========================================================================
  - name: total_products
    description: Total number of products in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(DISTINCT {{ ref('products', 'product_id') }})
    synonyms:
      - product_count
      - menu_items

  - name: average_product_catalog_price
    description: Average price of products in the catalog
    tables:
      - {{ ref('products') }}
    expr: AVG({{ ref('products', 'product_price') }})
    synonyms:
      - avg_menu_price

  - name: food_product_count
    description: Number of food products (jaffles) in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(CASE WHEN {{ ref('products', 'is_food_item') }} = TRUE THEN 1 END)
    synonyms:
      - jaffle_count
      - food_menu_items

  - name: drink_product_count
    description: Number of drink products (beverages) in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(CASE WHEN {{ ref('products', 'is_drink_item') }} = TRUE THEN 1 END)
    synonyms:
      - beverage_count
      - drink_menu_items

  # ===========================================================================
  # LOCATION METRICS
  # ===========================================================================
  - name: total_locations
    description: Total number of Jaffle Shop locations
    tables:
      - {{ ref('locations') }}
    expr: COUNT(DISTINCT {{ ref('locations', 'location_id') }})
    synonyms:
      - store_count
      - number_of_stores

  - name: average_tax_rate
    description: Average tax rate across all locations
    tables:
      - {{ ref('locations') }}
    expr: AVG({{ ref('locations', 'tax_rate') }})
    synonyms:
      - avg_tax_rate
      - mean_tax_rate

  # ===========================================================================
  # SUPPLY METRICS
  # ===========================================================================
  - name: total_supplies
    description: Total number of unique supplies used
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(DISTINCT {{ ref('supplies', 'supply_id') }})
    synonyms:
      - supply_count
      - ingredient_count

  - name: total_supply_catalog_cost
    description: Total cost of all supplies in the catalog
    tables:
      - {{ ref('supplies') }}
    expr: SUM({{ ref('supplies', 'supply_cost') }})
    synonyms:
      - supply_expenses
      - ingredient_costs

  - name: average_supply_cost
    description: Average cost per supply item
    tables:
      - {{ ref('supplies') }}
    expr: AVG({{ ref('supplies', 'supply_cost') }})
    synonyms:
      - avg_ingredient_cost

  - name: perishable_supply_count
    description: Number of perishable supplies
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = TRUE THEN 1 END)
    synonyms:
      - perishables_count

  - name: non_perishable_supply_count
    description: Number of non-perishable supplies
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = FALSE THEN 1 END)
    synonyms:
      - non_perishables_count

  # ===========================================================================
  # DDL PARITY TEST METRICS (exercises new SST features)
  # ===========================================================================

  # Exercises: non_additive_by (PR 4 / #138)
  - name: latest_order_total
    description: Latest order total per customer (semi-additive - cannot be summed across time)
    tables:
      - {{ ref('orders') }}
    expr: MAX({{ ref('orders', 'order_total') }})
    non_additive_by:
      - dimension: ordered_at
        order: DESC
        nulls: LAST

  # Exercises: using_relationships (PR 5 / #141)
  - name: revenue_by_location
    description: Revenue attributed via orders-to-locations relationship
    tables:
      - {{ ref('orders') }}
      - {{ ref('locations') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    using_relationships:
      - orders_to_locations

  # Exercises: window functions (PR 9 / #143)
  # Window metrics use <window_function>(<metric>) OVER (...) syntax per Snowflake docs.
  - name: cumulative_revenue
    description: Running total of revenue ordered by date (excludes date dimension from partition)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'total_revenue') }})
    window:
      partition_by_excluding:
        - "{{ ref('orders', 'ordered_at') }}"
      order_by:
        - column: "{{ ref('orders', 'ordered_at') }}"
          direction: ASC

  - name: customer_revenue_rank
    description: Revenue rank within each customer (most recent first)
    tables:
      - {{ ref('orders') }}
      - {{ ref('customers') }}
    expr: SUM({{ ref('orders', 'total_revenue') }})
    window:
      partition_by:
        - "{{ ref('customers', 'customer_id') }}"
      order_by:
        - column: "{{ ref('orders', 'ordered_at') }}"
          direction: DESC

  # Exercises: metric composition via metric() template (gap 3)
  # Derived metric that references another metric via template composition
  - name: net_revenue
    description: Net revenue after subtracting cost of goods sold (uses metric composition)
    tables:
      - {{ ref('orders') }}
    expr: "{{ metric('total_revenue') }} - {{ metric('total_order_cost') }}"

  # Exercises: PRIVATE metric visibility (gap 4)
  - name: internal_cost_ratio
    description: Internal cost ratio metric (private - not queryable by end users)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_cost') }}) / NULLIF(SUM({{ ref('orders', 'order_total') }}), 0)
    visibility: private

  # Exercises: legacy table()/column() templates (gap 7)
  - name: legacy_total_orders
    description: Total orders using legacy template syntax (backward compatibility test)
    tables:
      - {{ ref('orders') }}
    expr: COUNT(DISTINCT {{ column('orders', 'order_id') }})

  # ===========================================================================
  # ADDITIONAL METRICS - Volume & Edge Case Coverage
  # ===========================================================================

  # --- ORDER METRICS (Advanced) ---
  - name: median_order_value
    description: Median order total (approximation using PERCENTILE_CONT)
    tables:
      - {{ ref('orders') }}
    expr: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY {{ ref('orders', 'order_total') }})
    synonyms:
      - median order total
      - middle order value

  - name: max_order_value
    description: Maximum single order total
    tables:
      - {{ ref('orders') }}
    expr: MAX({{ ref('orders', 'order_total') }})
    synonyms:
      - largest order
      - highest order value

  - name: min_order_value
    description: Minimum single order total
    tables:
      - {{ ref('orders') }}
    expr: MIN({{ ref('orders', 'order_total') }})
    synonyms:
      - smallest order
      - lowest order value

  - name: order_value_range
    description: Range between max and min order values
    tables:
      - {{ ref('orders') }}
    expr: MAX({{ ref('orders', 'order_total') }}) - MIN({{ ref('orders', 'order_total') }})

  - name: high_value_order_count
    description: Number of orders exceeding $50
    tables:
      - {{ ref('orders') }}
    expr: COUNT(CASE WHEN {{ ref('orders', 'order_total') }} > 50 THEN 1 END)
    synonyms:
      - large orders
      - orders over fifty dollars

  - name: low_value_order_count
    description: Number of orders under $20
    tables:
      - {{ ref('orders') }}
    expr: COUNT(CASE WHEN {{ ref('orders', 'order_total') }} < 20 THEN 1 END)

  - name: avg_items_per_order
    description: Average number of items per order
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'count_order_items') }})
    synonyms:
      - items per order
      - average basket size

  - name: orders_with_food_and_drink
    description: Orders containing both food and drink items
    tables:
      - {{ ref('orders') }}
    expr: COUNT(CASE WHEN {{ ref('orders', 'is_food_order') }} = TRUE AND {{ ref('orders', 'is_drink_order') }} = TRUE THEN 1 END)

  - name: food_only_order_count
    description: Orders containing only food (no drinks)
    tables:
      - {{ ref('orders') }}
    expr: COUNT(CASE WHEN {{ ref('orders', 'is_food_order') }} = TRUE AND {{ ref('orders', 'is_drink_order') }} = FALSE THEN 1 END)

  - name: drink_only_order_count
    description: Orders containing only drinks (no food)
    tables:
      - {{ ref('orders') }}
    expr: COUNT(CASE WHEN {{ ref('orders', 'is_drink_order') }} = TRUE AND {{ ref('orders', 'is_food_order') }} = FALSE THEN 1 END)

  - name: repeat_customer_revenue
    description: Total revenue from returning customers only
    tables:
      - {{ ref('orders') }}
    expr: SUM(CASE WHEN {{ ref('orders', 'customer_order_number') }} > 1 THEN {{ ref('orders', 'order_total') }} ELSE 0 END)

  - name: first_order_revenue
    description: Total revenue from first-time orders only
    tables:
      - {{ ref('orders') }}
    expr: SUM(CASE WHEN {{ ref('orders', 'customer_order_number') }} = 1 THEN {{ ref('orders', 'order_total') }} ELSE 0 END)

  - name: avg_tax_per_order
    description: Average tax paid per order
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'tax_paid') }})

  - name: total_revenue_after_cost
    description: Net margin using metric composition (total_revenue minus total_order_cost)
    tables:
      - {{ ref('orders') }}
    expr: "{{ metric('total_revenue') }} - {{ metric('total_order_cost') }}"

  - name: cost_per_item
    description: Average cost per item ordered (composition of cost / items)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_cost') }}) / NULLIF(SUM({{ ref('orders', 'count_order_items') }}), 0)

  - name: revenue_per_item
    description: Average revenue per item ordered
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_total') }}) / NULLIF(SUM({{ ref('orders', 'count_order_items') }}), 0)

  - name: rolling_avg_revenue
    description: Rolling average revenue (window over ordered_at, excluding date from partition)
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'total_revenue') }})
    window:
      partition_by_excluding:
        - "{{ ref('orders', 'ordered_at') }}"
      order_by:
        - column: "{{ ref('orders', 'ordered_at') }}"
          direction: ASC

  # --- CUSTOMER METRICS (Advanced) ---
  - name: max_customer_lifetime_spend
    description: Highest lifetime spend among all customers
    tables:
      - {{ ref('customers') }}
    expr: MAX({{ ref('customers', 'lifetime_spend') }})

  - name: min_customer_lifetime_spend
    description: Lowest lifetime spend among all customers
    tables:
      - {{ ref('customers') }}
    expr: MIN({{ ref('customers', 'lifetime_spend') }})

  - name: high_value_customer_count
    description: Customers with lifetime spend over $500
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'lifetime_spend') }} > 500 THEN 1 END)
    synonyms:
      - VIP customers
      - premium customers

  - name: avg_customer_order_frequency
    description: Average number of orders per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'count_lifetime_orders') }})

  - name: single_order_customer_count
    description: Customers who placed exactly one order
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'count_lifetime_orders') }} = 1 THEN 1 END)
    synonyms:
      - one-time buyers
      - single purchase customers

  - name: loyal_customer_count
    description: Customers with 5 or more orders
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'count_lifetime_orders') }} >= 5 THEN 1 END)
    synonyms:
      - repeat buyers
      - loyal shoppers

  - name: customer_retention_rate
    description: Percentage of customers who are returning (not new)
    tables:
      - {{ ref('customers') }}
    expr: "{{ metric('returning_customer_count') }} * 100.0 / NULLIF({{ metric('total_customers') }}, 0)"

  - name: avg_days_between_orders
    description: Average days between first and last order per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG(DATEDIFF('day', {{ ref('customers', 'first_ordered_at') }}, {{ ref('customers', 'last_ordered_at') }}))

  # --- ORDER ITEMS METRICS (Advanced) ---
  - name: avg_item_price
    description: Average price per order item
    tables:
      - {{ ref('order_items') }}
    expr: AVG({{ ref('order_items', 'product_price') }})
    synonyms:
      - average item cost
      - mean item price

  - name: max_item_price
    description: Most expensive single item sold
    tables:
      - {{ ref('order_items') }}
    expr: MAX({{ ref('order_items', 'product_price') }})

  - name: min_item_price
    description: Cheapest single item sold
    tables:
      - {{ ref('order_items') }}
    expr: MIN({{ ref('order_items', 'product_price') }})

  - name: distinct_products_sold
    description: Number of unique products that have been ordered
    tables:
      - {{ ref('order_items') }}
    expr: COUNT(DISTINCT {{ ref('order_items', 'product_id') }})
    synonyms:
      - unique products sold
      - product variety

  - name: food_to_drink_ratio
    description: Ratio of food items sold to drink items sold
    tables:
      - {{ ref('order_items') }}
    expr: "{{ metric('food_items_sold') }} * 1.0 / NULLIF({{ metric('drink_items_sold') }}, 0)"

  # --- PRODUCT METRICS (Advanced) ---
  - name: most_expensive_product_price
    description: Price of the most expensive product in catalog
    tables:
      - {{ ref('products') }}
    expr: MAX({{ ref('products', 'product_price') }})

  - name: cheapest_product_price
    description: Price of the cheapest product in catalog
    tables:
      - {{ ref('products') }}
    expr: MIN({{ ref('products', 'product_price') }})

  - name: product_price_range
    description: Difference between most and least expensive products
    tables:
      - {{ ref('products') }}
    expr: MAX({{ ref('products', 'product_price') }}) - MIN({{ ref('products', 'product_price') }})

  - name: food_to_drink_product_ratio
    description: Ratio of food products to drink products in catalog
    tables:
      - {{ ref('products') }}
    expr: "{{ metric('food_product_count') }} * 1.0 / NULLIF({{ metric('drink_product_count') }}, 0)"

  # --- LOCATION METRICS (Advanced) ---
  - name: max_tax_rate
    description: Highest tax rate across all locations
    tables:
      - {{ ref('locations') }}
    expr: MAX({{ ref('locations', 'tax_rate') }})

  - name: min_tax_rate
    description: Lowest tax rate across all locations
    tables:
      - {{ ref('locations') }}
    expr: MIN({{ ref('locations', 'tax_rate') }})

  - name: tax_rate_spread
    description: Difference between highest and lowest tax rates
    tables:
      - {{ ref('locations') }}
    expr: MAX({{ ref('locations', 'tax_rate') }}) - MIN({{ ref('locations', 'tax_rate') }})

  # --- SUPPLY METRICS (Advanced) ---
  - name: most_expensive_supply
    description: Cost of the most expensive supply item
    tables:
      - {{ ref('supplies') }}
    expr: MAX({{ ref('supplies', 'supply_cost') }})

  - name: cheapest_supply
    description: Cost of the cheapest supply item
    tables:
      - {{ ref('supplies') }}
    expr: MIN({{ ref('supplies', 'supply_cost') }})

  - name: perishable_supply_percentage
    description: Percentage of supplies that are perishable
    tables:
      - {{ ref('supplies') }}
    expr: "{{ metric('perishable_supply_count') }} * 100.0 / NULLIF({{ metric('total_supplies') }}, 0)"

  - name: supply_cost_variance
    description: Variance in supply costs (measures spread)
    tables:
      - {{ ref('supplies') }}
    expr: VARIANCE({{ ref('supplies', 'supply_cost') }})

  - name: total_perishable_cost
    description: Total cost of perishable supplies only
    tables:
      - {{ ref('supplies') }}
    expr: SUM(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = TRUE THEN {{ ref('supplies', 'supply_cost') }} ELSE 0 END)

  - name: total_non_perishable_cost
    description: Total cost of non-perishable supplies only
    tables:
      - {{ ref('supplies') }}
    expr: SUM(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = FALSE THEN {{ ref('supplies', 'supply_cost') }} ELSE 0 END)
