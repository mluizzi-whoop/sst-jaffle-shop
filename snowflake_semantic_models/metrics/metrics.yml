snowflake_metrics:
  # ===========================================================================
  # ORDER METRICS
  # ===========================================================================
  - name: total_orders
    description: Total number of orders placed
    tables:
      - {{ ref('orders') }}
    expr: COUNT(DISTINCT {{ ref('orders', 'order_id') }})
    synonyms:
      - order_count
      - number_of_orders

  - name: total_revenue
    description: Total revenue from all orders (including tax)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    synonyms:
      - gross_revenue
      - total_sales
      - revenue

  - name: total_subtotal
    description: Total revenue before tax from all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'subtotal') }})
    synonyms:
      - pretax_revenue
      - revenue_before_tax

  - name: total_tax_collected
    description: Total tax collected from all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'tax_paid') }})
    synonyms:
      - tax_revenue
      - taxes_collected

  - name: total_order_cost
    description: Total cost of goods sold (supplies) for all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_cost') }})
    synonyms:
      - cogs
      - cost_of_goods_sold
      - total_cost

  - name: total_gross_profit
    description: Total gross profit (revenue minus cost of goods sold)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'subtotal') }}) - SUM({{ ref('orders', 'order_cost') }})
    synonyms:
      - gross_margin
      - profit_before_tax

  - name: average_order_value
    description: Average order value (total including tax)
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'order_total') }})
    synonyms:
      - aov
      - avg_order_value
      - mean_order_value

  - name: average_order_subtotal
    description: Average order subtotal (before tax)
    tables:
      - {{ ref('orders') }}
    expr: AVG({{ ref('orders', 'subtotal') }})
    synonyms:
      - avg_pretax_order
      - mean_subtotal

  - name: total_food_items_ordered
    description: Total number of food items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_food_items') }})
    synonyms:
      - food_item_count
      - total_food_orders

  - name: total_drink_items_ordered
    description: Total number of drink items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_drink_items') }})
    synonyms:
      - drink_item_count
      - total_drink_orders

  - name: total_items_ordered
    description: Total number of items ordered across all orders
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'count_order_items') }})
    synonyms:
      - item_count
      - total_items

  - name: food_order_percentage
    description: Percentage of orders that contain food items
    tables:
      - {{ ref('orders') }}
    expr: |
      COUNT(CASE WHEN {{ ref('orders', 'is_food_order') }} = TRUE THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - pct_food_orders
      - food_order_rate

  - name: drink_order_percentage
    description: Percentage of orders that contain drink items
    tables:
      - {{ ref('orders') }}
    expr: |
      COUNT(CASE WHEN {{ ref('orders', 'is_drink_order') }} = TRUE THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - pct_drink_orders
      - drink_order_rate

  - name: gross_profit_margin
    description: Gross profit margin percentage (gross profit / revenue)
    tables:
      - {{ ref('orders') }}
    expr: |
      (SUM({{ ref('orders', 'subtotal') }}) - SUM({{ ref('orders', 'order_cost') }})) * 100.0 /
      NULLIF(SUM({{ ref('orders', 'subtotal') }}), 0)
    synonyms:
      - profit_margin
      - margin_percentage

  # ===========================================================================
  # CUSTOMER METRICS
  # ===========================================================================
  - name: total_customers
    description: Total number of unique customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(DISTINCT {{ ref('customers', 'customer_id') }})
    synonyms:
      - customer_count
      - unique_customers
      - number_of_customers

  - name: total_customer_lifetime_spend
    description: Total lifetime spend across all customers
    tables:
      - {{ ref('customers') }}
    expr: SUM({{ ref('customers', 'lifetime_spend') }})
    synonyms:
      - total_ltv
      - aggregate_customer_value

  - name: average_customer_lifetime_spend
    description: Average lifetime spend per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'lifetime_spend') }})
    synonyms:
      - avg_ltv
      - average_customer_value
      - avg_clv

  - name: average_orders_per_customer
    description: Average number of orders per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'count_lifetime_orders') }})
    synonyms:
      - avg_order_frequency
      - orders_per_customer

  - name: new_customer_count
    description: Number of new customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'new' THEN 1 END)
    synonyms:
      - new_customers
      - first_time_customers

  - name: returning_customer_count
    description: Number of returning customers
    tables:
      - {{ ref('customers') }}
    expr: COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'returning' THEN 1 END)
    synonyms:
      - repeat_customers
      - loyal_customers

  - name: returning_customer_percentage
    description: Percentage of customers who are returning customers
    tables:
      - {{ ref('customers') }}
    expr: |
      COUNT(CASE WHEN {{ ref('customers', 'customer_type') }} = 'returning' THEN 1 END) * 100.0 /
      NULLIF(COUNT(*), 0)
    synonyms:
      - retention_rate
      - repeat_customer_rate

  - name: average_customer_lifetime_tax
    description: Average lifetime tax paid per customer
    tables:
      - {{ ref('customers') }}
    expr: AVG({{ ref('customers', 'lifetime_tax_paid') }})
    synonyms:
      - avg_tax_per_customer

  # ===========================================================================
  # ORDER ITEM METRICS
  # ===========================================================================
  - name: total_order_items
    description: Total number of individual order items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT({{ ref('order_items', 'order_item_id') }})
    synonyms:
      - items_sold
      - line_items_count

  - name: total_product_revenue
    description: Total revenue from product sales (sum of product prices)
    tables:
      - {{ ref('order_items') }}
    expr: SUM({{ ref('order_items', 'product_price') }})
    synonyms:
      - product_sales
      - item_revenue

  - name: total_supply_cost
    description: Total cost of supplies for all order items
    tables:
      - {{ ref('order_items') }}
    expr: SUM({{ ref('order_items', 'supply_cost') }})
    synonyms:
      - item_cost
      - supply_expenses

  - name: average_product_price
    description: Average price per product sold
    tables:
      - {{ ref('order_items') }}
    expr: AVG({{ ref('order_items', 'product_price') }})
    synonyms:
      - avg_item_price
      - mean_product_price

  - name: food_items_sold
    description: Total number of food items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT(CASE WHEN {{ ref('order_items', 'is_food_item') }} = TRUE THEN 1 END)
    synonyms:
      - food_sales_count
      - jaffles_sold

  - name: drink_items_sold
    description: Total number of drink items sold
    tables:
      - {{ ref('order_items') }}
    expr: COUNT(CASE WHEN {{ ref('order_items', 'is_drink_item') }} = TRUE THEN 1 END)
    synonyms:
      - drink_sales_count
      - beverages_sold

  - name: food_revenue
    description: Total revenue from food items
    tables:
      - {{ ref('order_items') }}
    expr: SUM(CASE WHEN {{ ref('order_items', 'is_food_item') }} = TRUE THEN {{ ref('order_items', 'product_price') }} ELSE 0 END)
    synonyms:
      - jaffle_revenue
      - food_sales

  - name: drink_revenue
    description: Total revenue from drink items
    tables:
      - {{ ref('order_items') }}
    expr: SUM(CASE WHEN {{ ref('order_items', 'is_drink_item') }} = TRUE THEN {{ ref('order_items', 'product_price') }} ELSE 0 END)
    synonyms:
      - beverage_revenue
      - drink_sales

  # ===========================================================================
  # PRODUCT METRICS
  # ===========================================================================
  - name: total_products
    description: Total number of products in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(DISTINCT {{ ref('products', 'product_id') }})
    synonyms:
      - product_count
      - menu_items

  - name: average_product_catalog_price
    description: Average price of products in the catalog
    tables:
      - {{ ref('products') }}
    expr: AVG({{ ref('products', 'product_price') }})
    synonyms:
      - avg_menu_price

  - name: food_product_count
    description: Number of food products (jaffles) in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(CASE WHEN {{ ref('products', 'is_food_item') }} = TRUE THEN 1 END)
    synonyms:
      - jaffle_count
      - food_menu_items

  - name: drink_product_count
    description: Number of drink products (beverages) in the catalog
    tables:
      - {{ ref('products') }}
    expr: COUNT(CASE WHEN {{ ref('products', 'is_drink_item') }} = TRUE THEN 1 END)
    synonyms:
      - beverage_count
      - drink_menu_items

  # ===========================================================================
  # LOCATION METRICS
  # ===========================================================================
  - name: total_locations
    description: Total number of Jaffle Shop locations
    tables:
      - {{ ref('locations') }}
    expr: COUNT(DISTINCT {{ ref('locations', 'location_id') }})
    synonyms:
      - store_count
      - number_of_stores

  - name: average_tax_rate
    description: Average tax rate across all locations
    tables:
      - {{ ref('locations') }}
    expr: AVG({{ ref('locations', 'tax_rate') }})
    synonyms:
      - avg_tax_rate
      - mean_tax_rate

  # ===========================================================================
  # SUPPLY METRICS
  # ===========================================================================
  - name: total_supplies
    description: Total number of unique supplies used
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(DISTINCT {{ ref('supplies', 'supply_id') }})
    synonyms:
      - supply_count
      - ingredient_count

  - name: total_supply_catalog_cost
    description: Total cost of all supplies in the catalog
    tables:
      - {{ ref('supplies') }}
    expr: SUM({{ ref('supplies', 'supply_cost') }})
    synonyms:
      - supply_expenses
      - ingredient_costs

  - name: average_supply_cost
    description: Average cost per supply item
    tables:
      - {{ ref('supplies') }}
    expr: AVG({{ ref('supplies', 'supply_cost') }})
    synonyms:
      - avg_ingredient_cost

  - name: perishable_supply_count
    description: Number of perishable supplies
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = TRUE THEN 1 END)
    synonyms:
      - perishables_count

  - name: non_perishable_supply_count
    description: Number of non-perishable supplies
    tables:
      - {{ ref('supplies') }}
    expr: COUNT(CASE WHEN {{ ref('supplies', 'is_perishable_supply') }} = FALSE THEN 1 END)
    synonyms:
      - non_perishables_count

  # ===========================================================================
  # DDL PARITY TEST METRICS (exercises new SST features)
  # ===========================================================================

  # Exercises: non_additive_by (PR 4 / #138)
  - name: latest_order_total
    description: Latest order total per customer (semi-additive - cannot be summed across time)
    tables:
      - {{ ref('orders') }}
    expr: "{{ ref('orders', 'order_total') }}"
    non_additive_by:
      - dimension: ordered_at
        order: DESC
        nulls: LAST

  # Exercises: using_relationships (PR 5 / #141)
  - name: revenue_by_location
    description: Revenue attributed via orders-to-locations relationship
    tables:
      - {{ ref('orders') }}
      - {{ ref('locations') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    using_relationships:
      - orders_to_locations

  # Exercises: window functions (PR 9 / #143)
  - name: cumulative_revenue
    description: Running total of revenue ordered by date (excludes date dimension from partition)
    tables:
      - {{ ref('orders') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    window:
      partition_by_excluding:
        - "{{ ref('orders', 'ordered_at') }}"
      order_by:
        - column: "{{ ref('orders', 'ordered_at') }}"
          direction: ASC

  - name: customer_revenue_rank
    description: Revenue rank within each customer (most recent first)
    tables:
      - {{ ref('orders') }}
      - {{ ref('customers') }}
    expr: SUM({{ ref('orders', 'order_total') }})
    window:
      partition_by:
        - "{{ ref('customers', 'customer_id') }}"
      order_by:
        - column: "{{ ref('orders', 'ordered_at') }}"
          direction: DESC
