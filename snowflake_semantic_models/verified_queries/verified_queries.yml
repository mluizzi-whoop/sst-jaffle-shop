snowflake_verified_queries:
  # ===========================================================================
  # VERIFIED QUERIES - Pre-validated questions for Cortex Analyst
  # ===========================================================================

  - name: monthly_revenue
    tables:
      - {{ ref('orders') }}
    question: "What is the total revenue by month?"
    sql: "SELECT DATE_TRUNC('MONTH', orders.ordered_at), SUM(orders.order_total) AS total_revenue FROM {{ ref('orders') }} GROUP BY 1 ORDER BY 1"
    use_as_onboarding_question: true
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: top_customers_by_revenue
    tables:
      - {{ ref('orders') }}
      - {{ ref('customers') }}
    question: "Who are the top 10 customers by total revenue?"
    sql: "SELECT customers.customer_name, SUM(orders.order_total) AS total_revenue FROM {{ ref('orders') }} JOIN {{ ref('customers') }} ON orders.customer_id = customers.customer_id GROUP BY 1 ORDER BY 2 DESC LIMIT 10"
    use_as_onboarding_question: true
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: orders_by_location
    tables:
      - {{ ref('orders') }}
      - {{ ref('locations') }}
    question: "How many orders were placed at each location?"
    sql: "SELECT locations.location_name, COUNT(orders.order_id) AS order_count FROM {{ ref('orders') }} JOIN {{ ref('locations') }} ON orders.location_id = locations.location_id GROUP BY 1 ORDER BY 2 DESC"
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: average_order_value_by_customer_type
    tables:
      - {{ ref('orders') }}
      - {{ ref('customers') }}
    question: "What is the average order value for new vs returning customers?"
    sql: "SELECT customers.customer_type, AVG(orders.order_total) AS avg_order_value FROM {{ ref('orders') }} JOIN {{ ref('customers') }} ON orders.customer_id = customers.customer_id GROUP BY 1"
    use_as_onboarding_question: true
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: daily_order_count
    tables:
      - {{ ref('orders') }}
    question: "How many orders are placed each day?"
    sql_file: sql/daily_order_count.sql
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: top_products_by_quantity
    tables:
      - {{ ref('order_items') }}
      - {{ ref('products') }}
    question: "What are the top 5 most ordered products?"
    sql_file: sql/top_products_by_quantity.sql
    use_as_onboarding_question: true
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: revenue_by_product_type
    tables:
      - {{ ref('order_items') }}
      - {{ ref('products') }}
    question: "What is the total revenue by product type (food vs drink)?"
    sql: "SELECT products.product_type, SUM(order_items.product_price) AS total_revenue FROM {{ ref('order_items') }} JOIN {{ ref('products') }} ON order_items.product_id = products.product_id GROUP BY 1"
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: customer_lifetime_value_distribution
    tables:
      - {{ ref('customers') }}
    question: "What is the distribution of customer lifetime spend?"
    sql: "SELECT CASE WHEN customers.lifetime_spend < 100 THEN 'Under $100' WHEN customers.lifetime_spend < 500 THEN '$100-$500' ELSE 'Over $500' END AS spend_tier, COUNT(customers.customer_id) AS customer_count FROM {{ ref('customers') }} GROUP BY 1 ORDER BY 2 DESC"
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"

  - name: supply_cost_by_product
    tables:
      - {{ ref('supplies') }}
      - {{ ref('products') }}
    question: "What is the total supply cost per product?"
    sql_file: sql/supply_cost_by_product.sql
    verified_by: "analytics-team@jaffle.shop"
    verified_at: "2026-05-01"
