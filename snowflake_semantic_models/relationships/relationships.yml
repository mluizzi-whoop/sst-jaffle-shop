# ============================================================================
# JAFFLE SHOP RELATIONSHIPS
# ============================================================================
# Defines how tables join together in the Jaffle Shop data model.
# Documentation: https://github.com/WhoopInc/snowflake-semantic-tools/blob/main/docs/semantic-models-guide.md

snowflake_relationships:
  # ===========================================================================
  # ORDERS RELATIONSHIPS
  # ===========================================================================
  
  # Orders to Customers
  # Each order belongs to exactly one customer
  - name: orders_to_customers
    left_table: {{ ref('orders') }}
    right_table: {{ ref('customers') }}
    relationship_conditions:
      - "{{ ref('orders', 'customer_id') }} = {{ ref('customers', 'customer_id') }}"

  # Orders to Locations
  # Each order is placed at exactly one location
  - name: orders_to_locations
    left_table: {{ ref('orders') }}
    right_table: {{ ref('locations') }}
    relationship_conditions:
      - "{{ ref('orders', 'location_id') }} = {{ ref('locations', 'location_id') }}"

  # ===========================================================================
  # ORDER ITEMS RELATIONSHIPS
  # ===========================================================================
  
  # Order Items to Orders
  # Each order item belongs to exactly one order
  - name: order_items_to_orders
    left_table: {{ ref('order_items') }}
    right_table: {{ ref('orders') }}
    relationship_conditions:
      - "{{ ref('order_items', 'order_id') }} = {{ ref('orders', 'order_id') }}"

  # Order Items to Products
  # Each order item references exactly one product
  - name: order_items_to_products
    left_table: {{ ref('order_items') }}
    right_table: {{ ref('products') }}
    relationship_conditions:
      - "{{ ref('order_items', 'product_id') }} = {{ ref('products', 'product_id') }}"

  # ===========================================================================
  # SUPPLIES RELATIONSHIPS
  # ===========================================================================
  
  # Supplies to Products
  # Each supply is associated with exactly one product
  - name: supplies_to_products
    left_table: {{ ref('supplies') }}
    right_table: {{ ref('products') }}
    relationship_conditions:
      - "{{ ref('supplies', 'product_id') }} = {{ ref('products', 'product_id') }}"

  # ===========================================================================
  # ASOF RELATIONSHIPS (Temporal)
  # ===========================================================================

  # Orders to Locations (ASOF temporal join)
  # Matches orders to locations that were open at the time of the order
  - name: orders_to_locations_asof
    left_table: {{ ref('orders') }}
    right_table: {{ ref('locations') }}
    relationship_conditions:
      - "{{ ref('orders', 'location_id') }} = {{ ref('locations', 'location_id') }}"
      - "{{ ref('orders', 'ordered_at') }} >= {{ ref('locations', 'opened_date') }}"

  # ===========================================================================
  # RANGE JOIN RELATIONSHIPS (Preview Feature)
  # ===========================================================================

  # Orders to Pricing Periods (Range Join)
  # Each order falls into exactly one pricing period based on its order date
  - name: orders_to_pricing_periods
    left_table: {{ ref('orders') }}
    right_table: {{ ref('pricing_periods') }}
    relationship_conditions:
      - "{{ ref('orders', 'ordered_at') }} BETWEEN {{ ref('pricing_periods', 'effective_start_date') }} AND {{ ref('pricing_periods', 'effective_end_date') }} EXCLUSIVE"

