version: 2
models:
  - name: pricing_periods
    description: 'Pricing periods with non-overlapping date ranges. Each order falls into exactly one pricing period based on its order date.'
    meta:
      sst:
        cortex_searchable: false
        synonyms:
          - pricing tiers
          - rate periods
          - price schedule
        primary_key: pricing_period_id
        unique_keys: []
        constraints:
          - type: distinct_range
            name: pricing_effective_range
            start_column: effective_start_date
            end_column: effective_end_date

    columns:
      - name: pricing_period_id
        description: 'Unique identifier for the pricing period.'
        meta:
          sst:
            column_type: dimension
            data_type: TEXT
            synonyms:
              - period ID
              - pricing ID

      - name: period_name
        description: 'Human-readable name for the pricing period.'
        meta:
          sst:
            column_type: dimension
            data_type: TEXT
            synonyms:
              - pricing tier name
              - period label

      - name: base_price_multiplier
        description: 'Multiplier applied to base prices during this period.'
        meta:
          sst:
            column_type: fact
            data_type: NUMBER
            synonyms:
              - price multiplier
              - pricing factor

      - name: discount_pct
        description: 'Discount percentage applied during this period.'
        meta:
          sst:
            column_type: fact
            data_type: NUMBER
            synonyms:
              - discount percentage
              - discount rate

      - name: effective_start_date
        description: 'Start date of this pricing period (inclusive).'
        meta:
          sst:
            column_type: time_dimension
            data_type: DATE
            synonyms:
              - period start
              - effective from

      - name: effective_end_date
        description: 'End date of this pricing period (exclusive).'
        meta:
          sst:
            column_type: time_dimension
            data_type: DATE
            synonyms:
              - period end
              - effective until
